<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <title>Paint Robots</title>
    <!-- Весь экран, без зума; viewport-fit=cover — заходим под «чёлку» -->
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- iOS: при запуске с домашнего экрана — без интерфейса браузера -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Paint Robots">
    <meta name="theme-color" content="#21232b">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
      html, body {
        margin: 0; padding: 0; width: 100%; height: 100%;
        overflow: hidden; background: #21232b;
        overscroll-behavior: none; touch-action: none;
        -webkit-user-select: none; user-select: none;
        -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
      }
      #unity-canvas {
        position: fixed; left: 0; top: 0;
        width: 100vw; height: 100vh; height: 100dvh;
        display: block; background: #21232b; outline: none;
        touch-action: none;
      }
      #loading {
        position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
        width: min(60vw, 320px); text-align: center;
        font: 600 16px/1.4 -apple-system, system-ui, Roboto, sans-serif; color: #f2f4f8;
      }
      #bar { margin-top: 10px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.12); overflow: hidden; }
      #fill { height: 100%; width: 0; background: #3d8cff; transition: width 0.2s; }
      #tip {
        position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
        padding: 6px 14px; border-radius: 14px; background: rgba(10,12,18,0.8);
        font: 14px/1.3 -apple-system, system-ui, Roboto, sans-serif; color: #f2f4f8;
        display: none; pointer-events: none; text-align: center; max-width: 90vw;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading">Paint Robots<div id="bar"><div id="fill"></div></div></div>
    <div id="tip"></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                     (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1); // iPadOS притворяется Mac
      var isStandalone = window.matchMedia("(display-mode: fullscreen)").matches ||
                         window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;

      // Полноэкранный режим по первому касанию (браузеры разрешают его только из жеста пользователя)
      function canFullscreen() {
        var el = document.documentElement;
        return !!(el.requestFullscreen || el.webkitRequestFullscreen);
      }
      function isFullscreen() { return !!(document.fullscreenElement || document.webkitFullscreenElement); }
      function goFullscreen() {
        if (isFullscreen()) return;
        var el = document.documentElement;
        var req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (!req) return;
        try {
          var p = req.call(el, { navigationUI: "hide" });
          if (p && p.catch) p.catch(function () {});
        } catch (e) {}
      }
      if (isMobile && !isStandalone) {
        if (canFullscreen()) {
          document.addEventListener("touchend", goFullscreen, { passive: true });
        } else {
          // iPhone Safari не умеет полноэкранный режим для страниц — подсказываем про домашний экран
          var tip = document.querySelector("#tip");
          tip.textContent = "Для полного экрана: «Поделиться» → «На экран „Домой“»";
          tip.style.display = "block";
          setTimeout(function () { tip.style.display = "none"; }, 7000);
        }
      }
      // не даём странице скроллиться/зумиться жестами
      document.addEventListener("gesturestart", function (e) { e.preventDefault(); });
      document.addEventListener("touchmove", function (e) { e.preventDefault(); }, { passive: false });

      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, {
          arguments: [],
          dataUrl: "Build/WebGL.data.unityweb",
          frameworkUrl: "Build/WebGL.framework.js.unityweb",
          codeUrl: "Build/WebGL.wasm.unityweb",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "PaintRobots",
          productName: "Paint Robots",
          productVersion: "1.0",
          // на телефонах ограничиваем плотность пикселей — иначе тяжело для GPU
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 2 : 3),
        }, function (progress) {
          document.querySelector("#fill").style.width = (100 * progress) + "%";
        }).then(function () {
          document.querySelector("#loading").style.display = "none";
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
